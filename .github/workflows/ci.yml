name: CI

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upstream cleanyourtv at the pinned commit
        run: |
          commit=$(jq -r .commit upstream.lock.json)
          git init -q ../cleanyourtv
          git -C ../cleanyourtv fetch -q --depth 1 https://github.com/Gathin23/cleanyourtv "$commit"
          git -C ../cleanyourtv checkout -q FETCH_HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reference ADB client (adb-shell, as upstream uses) for the ADB tests
        run: python3 -m venv testing/venv && testing/venv/bin/pip install -q -r testing/requirements.txt
      - name: The fake adbd satisfies adb-shell
        run: testing/venv/bin/python -m unittest testing/fake-tv/test_adbd.py
      - run: npm run typecheck
      - run: npm test
      - name: Conformance with upstream's own scripts
        run: npx tsx conformance/run.ts --random 300 --jobs 8
      - name: The list feed builds
        run: npx tsx scripts/lists/build.ts --dev-key --out /tmp/feed
