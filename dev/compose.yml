# A local stand-in for a Supabase project's auth, for development and the browser end-to-end test:
# Postgres, Supabase's own auth server (GoTrue), a mail catcher, and a gateway that serves auth at /auth/v1 as a
# hosted project does. The app and the backend point at http://localhost:54321 exactly as they would at
# https://<ref>.supabase.co. Start with `npm run dev:stack` (writes dev/.env with fresh keys first).
name: kantv-dev
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["127.0.0.1:54322:5432"]
    volumes: ["./initdb.sql:/docker-entrypoint-initdb.d/initdb.sql:ro"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 1s
      retries: 30
  auth:
    image: supabase/gotrue:v2.180.0
    depends_on:
      db: { condition: service_healthy }
    env_file: .env
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      PORT: 9999
      API_EXTERNAL_URL: http://localhost:54321/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:postgres@db:5432/auth?search_path=auth
      GOTRUE_SITE_URL: http://localhost:8081
      GOTRUE_URI_ALLOW_LIST: http://localhost:8081
      GOTRUE_JWT_ISSUER: http://localhost:54321/auth/v1
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_EXP: 3600
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_MAILER_OTP_EXP: 600
      GOTRUE_MAILER_OTP_LENGTH: 6
      GOTRUE_SMTP_HOST: mail
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_ADMIN_EMAIL: no-reply@kantv.local
      GOTRUE_SMTP_SENDER_NAME: KanTV
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: http://gateway/templates/sign-in-code.html
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: http://gateway/templates/sign-in-code.html
      GOTRUE_MAILER_SUBJECTS_MAGIC_LINK: Your KanTV sign-in code
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: Your KanTV sign-in code
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 1000
  mail:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:54324:8025"]
  gateway:
    image: nginx:1.27-alpine
    depends_on: [auth]
    ports: ["127.0.0.1:54321:80"]
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ../supabase/templates:/usr/share/nginx/templates:ro
