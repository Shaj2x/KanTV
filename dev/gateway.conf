server {
  listen 80;
  # Supabase serves auth under /auth/v1 on the project URL, with CORS done by its gateway; same here.
  location /auth/v1/ {
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin * always;
      add_header Access-Control-Allow-Headers "authorization, apikey, content-type, x-client-info, x-supabase-api-version" always;
      add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
      add_header Access-Control-Max-Age 600 always;
      return 204;
    }
    proxy_hide_header Access-Control-Allow-Origin;
    add_header Access-Control-Allow-Origin * always;
    proxy_pass http://auth:9999/;
    proxy_set_header Host $host;
  }
  # The email templates, for the auth server to fetch (a hosted project keeps them in its dashboard).
  location /templates/ {
    alias /usr/share/nginx/templates/;
  }
}
